name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Run Tests & Build Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Run Tests & Package JAR
        run: ./mvnw clean verify -B --no-transfer-progress

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shop-api-jar
          path: target/shop-api-0.0.1-SNAPSHOT.jar
          retention-days: 1
