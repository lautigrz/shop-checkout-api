services:
  shop-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shop-api-app
    restart: always
    ports:
      - "80:8080"
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    volumes:
      - ./certs/global-bundle.pem:/app/certs/global-bundle.pem:ro
