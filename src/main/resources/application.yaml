spring:
  application:
    name: shop-api

  datasource:
    url: jdbc:postgresql://localhost:5432/shop?options=-c%20timezone=UTC
    username: shop
    password: shop
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jwt:
    secret-key: ${JWT_SECRET_KEY:default-secret-key}
    expiration-time: ${JWT_EXPIRATION_TIME:36000}
  mongodb:
    uri: mongodb://localhost:27017/shop

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
